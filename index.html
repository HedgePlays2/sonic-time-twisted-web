  <!-- =======================================================
       GAME.UNX MULTI-PART LOADER
       =======================================================

       The game.unx file is split into four parts.

       The important optimization here is that all four
       pieces are downloaded concurrently.

       We also cache the combined result so that repeated
       requests don't download and join the four pieces again.
       ======================================================= -->

  <script>
  (() => {

    "use strict";

    const TARGET_FILE = "game.unx";
    const NUM_PARTS = 4;

    const combinedCache = new Map();
    const pendingRequests = new Map();

    const originalFetch = window.fetch.bind(window);
    const OriginalXHR = window.XMLHttpRequest;


    async function fetchAndCombine(baseUrl) {

      /*
        Reuse a completed result.
      */
      if (combinedCache.has(baseUrl)) {
        return combinedCache.get(baseUrl);
      }

      /*
        If multiple requests arrive at the same time,
        only perform the expensive join once.
      */
      if (pendingRequests.has(baseUrl)) {
        return pendingRequests.get(baseUrl);
      }

      const promise = (async () => {

        const urls = new Array(NUM_PARTS);

        for (let i = 0; i < NUM_PARTS; i++) {
          urls[i] = `${baseUrl}.part${i + 1}`;
        }

        /*
          Download all four pieces concurrently.
        */
        const responses = await Promise.all(
          urls.map(url => originalFetch(url))
        );

        for (const response of responses) {

          if (!response.ok) {
            throw new Error(
              `Failed to download part: ${response.url}`
            );
          }

        }

        /*
          Read the four files concurrently.
        */
        const buffers = await Promise.all(
          responses.map(response => response.arrayBuffer())
        );

        let totalLength = 0;

        for (const buffer of buffers) {
          totalLength += buffer.byteLength;
        }

        /*
          Only one combined allocation.
        */
        const combined = new Uint8Array(totalLength);

        let offset = 0;

        for (const buffer of buffers) {

          combined.set(
            new Uint8Array(buffer),
            offset
          );

          offset += buffer.byteLength;

        }

        const result = combined.buffer;

        /*
          Cache the combined result for this page session.
        */
        combinedCache.set(baseUrl, result);

        pendingRequests.delete(baseUrl);

        return result;

      })().catch(error => {

        pendingRequests.delete(baseUrl);
        throw error;

      });

      pendingRequests.set(baseUrl, promise);

      return promise;
    }


    /*
      FETCH PATCH
    */

    window.fetch = async function(input, init) {

      const url =
        typeof input === "string"
          ? input
          : input instanceof Request
            ? input.url
            : "";

      if (url.endsWith(TARGET_FILE)) {

        try {

          const combinedBuffer =
            await fetchAndCombine(url);

          return new Response(
            combinedBuffer,
            {
              status: 200,
              statusText: "OK",
              headers: {
                "Content-Type":
                  "application/octet-stream"
              }
            }
          );

        } catch (error) {

          console.error(
            "Fetch patch failed for game.unx:",
            error
          );

        }

      }

      return originalFetch(input, init);
    };


    /*
      XHR PATCH
      GameMaker can use XHR instead of fetch.
    */

    window.XMLHttpRequest = function() {

      const xhr = new OriginalXHR();

      const originalOpen = xhr.open.bind(xhr);
      const originalSend = xhr.send.bind(xhr);

      let isTarget = false;
      let targetUrl = "";


      xhr.open = function(method, url, ...args) {

        targetUrl = String(url);

        isTarget =
          targetUrl.endsWith(TARGET_FILE);

        return originalOpen(
          method,
          url,
          ...args
        );
      };


      xhr.send = function(data) {

        if (!isTarget) {
          return originalSend(data);
        }


        fetchAndCombine(targetUrl)
          .then(buffer => {

            /*
              Reproduce the minimum XHR state needed
              by the GameMaker loader.
            */

            Object.defineProperty(
              xhr,
              "readyState",
              {
                value: 4,
                configurable: true
              }
            );

            Object.defineProperty(
              xhr,
              "status",
              {
                value: 200,
                configurable: true
              }
            );

            Object.defineProperty(
              xhr,
              "statusText",
              {
                value: "OK",
                configurable: true
              }
            );


            let responseValue = buffer;


            if (xhr.responseType === "blob") {

              responseValue =
                new Blob([buffer]);

            } else if (
              xhr.responseType === "text" ||
              !xhr.responseType
            ) {

              responseValue =
                new TextDecoder().decode(buffer);

              Object.defineProperty(
                xhr,
                "responseText",
                {
                  value: responseValue,
                  configurable: true
                }
              );

            }


            Object.defineProperty(
              xhr,
              "response",
              {
                value: responseValue,
                configurable: true
              }
            );


            if (
              typeof xhr.onreadystatechange ===
              "function"
            ) {
              xhr.onreadystatechange();
            }

            if (
              typeof xhr.onload ===
              "function"
            ) {
              xhr.onload();
            }

          })
          .catch(error => {

            console.error(
              "XHR patch failed for game.unx:",
              error
            );

            Object.defineProperty(
              xhr,
              "status",
              {
                value: 500,
                configurable: true
              }
            );

            if (
              typeof xhr.onerror ===
              "function"
            ) {
              xhr.onerror(error);
            }

          });

      };


      return xhr;
    };


    window.XMLHttpRequest.prototype =
      OriginalXHR.prototype;

  })();
  </script>

  <script>
  "use strict";


  /* =========================================================
     DOM REFERENCES
     ========================================================= */

  const bodyElement =
    document.body;

  const statusElement =
    document.getElementById("status");

  const progressElement =
    document.getElementById("progress");

  const spinnerElement =
    document.getElementById("spinner");

  const loadingElement =
    document.getElementById("loading");

  const canvasElement =
    document.getElementById("canvas");

  const outputElement =
    document.getElementById("output");

  const outputContainerElement =
    document.getElementById("output-container");

  const pauseMenu =
    document.getElementById(
      "pauseMenuContainer"
    );

  const quitButton =
    document.getElementById(
      "quitButton"
    );

  const messageContainerElement =
    document.getElementById(
      "message-container"
    );

  const messagesElement =
    document.getElementById(
      "messages"
    );


  /* =========================================================
     PERFORMANCE SETTINGS
     ========================================================= */

  /*
    IMPORTANT:

    The old HTML explicitly did:

      canvas.width = 1920;
      canvas.height = 1080;

    That has been removed.

    We allow GameMaker to decide its internal resolution.
  */

  const CHANGE_ASPECT_RATIO = true;


  let startingHeight;
  let startingWidth;
  let startingAspect;


  /* =========================================================
     BACKGROUND COLOR
     ========================================================= */

  function changecolor(element) {

    bodyElement.style.backgroundColor =
      element.value;

  }


  /* =========================================================
     MESSAGE SYSTEM
     ========================================================= */

  let rollbackMessages = [];
  let clearRollbackMessagesTimeoutId = -1;


  function showRollbackMessage(message) {

    rollbackMessages.push(message);

    /*
      Build once instead of repeatedly modifying the DOM.
    */
    messagesElement.textContent =
      rollbackMessages.join("\n");

    messageContainerElement.style.display =
      "block";


    clearTimeout(
      clearRollbackMessagesTimeoutId
    );

    clearRollbackMessagesTimeoutId =
      setTimeout(
        clearRollbackMessages,
        5000
      );

  }


  function clearRollbackMessages() {

    clearRollbackMessagesTimeoutId = -1;

    rollbackMessages.length = 0;

    messageContainerElement.style.display =
      "none";

  }


  /* =========================================================
     GAME OUTPUT
     ========================================================= */

  let loadprogress = 0;


  const Module = {

    preRun: [],

    postRun: [],


    /*
      Keep normal console output cheap.

      The old version appended every single message
      directly to the textarea, which can become expensive.
    */

    print: (() => {

      const element =
        outputElement;

      if (element) {
        element.value = "";
      }


      return function(text) {

        if (arguments.length > 1) {

          text =
            Array.prototype
              .slice
              .call(arguments)
              .join(" ");

        }


        /*
          Loading messages still update the status.
        */

        if (text === "Starting WAD") {
          loadprogress++;
        }


        if (loadprogress === 1) {

          Module.setStatus(text);

        } else if (loadprogress >= 2) {

          Module.setStatus("");

        }


        /*
          Only write the huge console output if
          the user has actually opened it.

          This saves DOM work during normal gameplay.
        */

        if (
          outputElement.style.display !==
          "none"
        ) {

          outputElement.value +=
            text + "\n";

          outputElement.scrollTop =
            outputElement.scrollHeight;

        }


        /*
          GameMaker uses this message to indicate
          the main loop has started.
        */

        if (
          text === "Entering main loop."
        ) {

          loadprogress++;

          ensureAspectRatio();

        }

      };

    })(),


    printErr: function(text) {

      if (arguments.length > 1) {

        text =
          Array.prototype
            .slice
            .call(arguments)
            .join(" ");

      }

      console.error(text);

    },


    canvas: canvasElement,


    setStatus: function(text) {

      if (!Module.setStatus.last) {

        Module.setStatus.last = {
          time: Date.now(),
          text: ""
        };

      }


      if (
        text ===
        Module.setStatus.last.text
      ) {
        return;
      }


      const match =
        text.match(
          /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/
        );


      const now =
        Date.now();


      /*
        Avoid updating the DOM dozens of times
        per second during downloads.
      */

      if (
        match &&
        now - Module.setStatus.last.time < 50
      ) {
        return;
      }


      Module.setStatus.last.time =
        now;

      Module.setStatus.last.text =
        text;


      if (match) {

        text = match[1];

        progressElement.value =
          parseInt(match[2], 10) * 100;

        progressElement.max =
          parseInt(match[4], 10) * 100;

        progressElement.hidden =
          false;

        spinnerElement.hidden =
          false;

      } else {

        progressElement.hidden =
          true;


        if (!text) {

          spinnerElement.style.display =
            "none";

          loadingElement.style.display =
            "none";

          canvasElement.style.display =
            "block";

          canvasElement.classList.add(
            "active"
          );

        }

      }


      statusElement.textContent =
        text;

    },


    totalDependencies: 0,


    monitorRunDependencies: function(left) {

      this.totalDependencies =
        Math.max(
          this.totalDependencies,
          left
        );


      if (left) {

        Module.setStatus(
          "Preparing... (" +
          (
            this.totalDependencies -
            left
          ) +
          "/" +
          this.totalDependencies +
          ")"
        );

      } else {

        Module.setStatus(
          "All downloads complete."
        );

      }

    }

  };


  Module.setStatus(
    "Downloading..."
  );


  /* =========================================================
     ERROR HANDLING
     ========================================================= */

  window.onerror = function(event) {

    Module.setStatus(
      "Exception thrown, see JavaScript console"
    );

    spinnerElement.style.display =
      "none";

    console.error(event);

  };


  /* =========================================================
     URL ARGUMENTS
     ========================================================= */

  if (
    typeof window === "object"
  ) {

    Module.arguments =
      window.location.search
        .substr(1)
        .trim()
        .split("&");


    if (!Module.arguments[0]) {
      Module.arguments = [];
    }

  }


  /* =========================================================
     CONSOLE TOGGLE
     ========================================================= */

  function toggleConsole() {

    const isShown =
      outputElement.style.display ===
      "block";


    if (isShown) {

      outputElement.style.display =
        "none";

    } else {

      outputElement.style.display =
        "block";

      outputElement.scrollIntoView({
        block: "start"
      });

    }

  }


  /* =========================================================
     GITHUB
     ========================================================= */

  function togglegithub() {

    window.open(
      "https://github.com/overbound/SonicTimeTwisted",
      "_blank"
    );

  }


  /* =========================================================
     CLEAR CACHE
     ========================================================= */

  function toggleclear_site_cache() {

    if (
      !confirm(
        "This Will Clear Site Cache\n" +
        "This will ALSO Clear ALL SAVES\n\n" +
        "ONLY do this if the Site has recently been Updated\n" +
        "and if you are experiencing crashes relating to texture loading\n\n" +
        "Continue?"
      )
    ) {
      return;
    }


    (async () => {

      try {

        if (
          "indexedDB" in window &&
          typeof indexedDB.databases ===
          "function"
        ) {

          const databases =
            await indexedDB.databases();


          for (
            const database of databases
          ) {

            if (database.name) {
              indexedDB.deleteDatabase(
                database.name
              );
            }

          }

        }

      } catch (error) {

        console.error(
          "Failed to clear IndexedDB:",
          error
        );

      }

      alert(
        "All Site Cache Has Been Cleared!\n" +
        "Please reload the Page"
      );

    })();

  }


  /* =========================================================
     FPS COUNTER
     ========================================================= */

  let stopfps = 0;


  function toggleFPS() {

    if (stopfps !== 0) {
      return;
    }


    stopfps = 1;


    const script =
      document.createElement("script");


    script.onload = function() {

      if (
        typeof Stats ===
        "undefined"
      ) {
